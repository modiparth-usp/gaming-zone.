<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Game Directory</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #050505;
      color: white;
      font-family: Arial, sans-serif;
    }

    header {
      padding: 20px;
      text-align: center;
      border-bottom: 1px solid #8b650d;
    }

    h1 {
      color: #ffdf72;
      margin: 0;
    }

    .games {
      max-width: 900px;
      margin: 30px auto;
      padding: 15px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 18px;
    }

    .game {
      text-align: center;
      padding: 25px;
      border: 1px solid #8b650d;
      border-radius: 18px;
      background: #101010;
    }

    .logo {
      width: 110px;
      height: 110px;
      object-fit: contain;
      display: block;
      margin: 0 auto 15px;
      border-radius: 50%;
    }

    h2 {
      color: #ffdf72;
    }

    @media (max-width: 600px) {
      .games {
        grid-template-columns: 1fr 1fr;
      }

      .logo {
        width: 85px;
        height: 85px;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>👑 GAME DIRECTORY</h1>
</header>

<main class="games">

  <div class="game">
    <img class="logo" src="./iv7-vip.png" alt="IV7 logo">
    <h2>IV7</h2>
  </div>

  <div class="game">
    <img class="logo" src="./in7-vip.png" alt="IN7 logo">
    <h2>IN7</h2>
  </div>

  <div class="game">
    <img class="logo" src="./ix7-vip.png" alt="IX7 logo">
    <h2>IX7</h2>
  </div>

  <div class="game">
    <img class="logo" src="./ic7-vip.png" alt="IC7 logo">
    <h2>IC7</h2>
  </div>

  <div class="game">
    <img class="logo" src="./benz-vip.png" alt="Benz logo">
    <h2>Benz</h2>
  </div>

  <div class="game">
    <img class="logo" src="./ek1-vip.png" alt="EK1 logo">
    <h2>EK1</h2>
  </div>

  <div class="game">
    <img class="logo" src="./raja7-vip.png" alt="Raja7 logo">
    <h2>Raja7</h2>
  </div>

  <div class="game">
    <img class="logo" src="./mgm-vip.png" alt="MGM logo">
    <h2>MGM</h2>
  </div>

</main>

</body>
</html>
